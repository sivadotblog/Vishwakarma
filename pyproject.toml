# Virtual uv workspace root: holds shared dev tooling, no package of its own.
[tool.uv.workspace]
members = ["apps/api", "packages/software-factory"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["./software-factory"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["api", "software_factory"]

[tool.mypy]
strict = true
files = ["apps/api/src", "apps/api/tests", "packages/software-factory/src", "packages/software-factory/tests"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/software-factory/tests"]
