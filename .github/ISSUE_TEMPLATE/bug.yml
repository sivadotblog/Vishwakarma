name: Bug report
description: Something is broken.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [web (apps/web), api (apps/api), CI / tooling, Not sure]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include exact error messages or logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
